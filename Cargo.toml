[package]
name = "vgc_engine"
version = "0.2.0"
edition = "2024"

[lib]
# `cdylib` is what Python loads; `rlib` is what the binaries and tests link.
crate-type = ["rlib", "cdylib"]

[dependencies]
numpy = { version = "0.29.0", optional = true }
pyo3 = { version = "0.29.3", optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
# Record every RNG draw and action so a divergence from Showdown can be pinpointed.
trace = []
# The Python extension module (built by maturin: see pyproject.toml).
python = ["dep:pyo3", "dep:numpy"]

[profile.release]
debug = 1
